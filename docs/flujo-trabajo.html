    --bosque:#93b498;--accent:#e1a644;--accent-ink:#e8b862;--accent-wash:#3a2f1a;--pizarra:#8cb3cf;
  }
}
:root[data-theme="dark"]{
  --ground:#171510;--surface:#211e18;--surface-2:#2a261f;
  --ink:#e8e2d6;--ink-soft:#c6bfb1;--ink-mute:#958d7e;

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
main{max-width:1720px;margin:0 auto;padding:40px 30px 52px}

.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 22px;margin-bottom:26px}
.head h1{font-family:var(--display);font-weight:600;font-size:29px;letter-spacing:.01em;margin:0;line-height:1.1}
.head .sub{font-size:13.5px;color:var(--ink-mute)}
.head .sub b{color:var(--ink-soft);font-weight:600}

.board{overflow-x:auto;padding-bottom:6px}
.board svg{display:block;width:100%;min-width:1160px;height:auto}

.s-card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.s-card-wip{fill:var(--surface);stroke:var(--accent);stroke-width:1.3}
.s-rule-soft{stroke:var(--line-soft);stroke-width:1}
.s-spine{stroke:var(--bosque);stroke-width:2.6;fill:none}
.s-spine-todo{stroke:var(--accent);stroke-width:2.6;fill:none;stroke-dasharray:7 5}
.s-loop{stroke:var(--pizarra);stroke-width:1.7;fill:none;stroke-dasharray:7 5}
.s-lead{stroke:var(--ink-mute);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.mk-g{fill:var(--bosque)}.mk-a{fill:var(--accent)}.mk-p{fill:var(--pizarra)}

text{font-family:var(--body);fill:var(--ink)}
.t-num{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.16em;fill:var(--bosque)}
.t-num-wip{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.16em;fill:var(--accent-ink)}
.t-name{font-family:var(--display);font-size:20px;font-weight:600;fill:var(--ink)}
.t-role{font-size:10px;letter-spacing:.1em;fill:var(--ink-mute)}
.t-app{font-size:12.5px;fill:var(--ink-soft)}
.t-lbl{font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.18em;fill:var(--ink-mute)}
.t-body{font-size:12.5px;fill:var(--ink)}
.t-tab{font-family:var(--mono);font-size:10px;fill:var(--ink-mute)}
.t-fig{font-family:var(--display);font-size:16px;font-weight:700;fill:var(--bosque);font-variant-numeric:tabular-nums}
.t-fig-wip{font-family:var(--display);font-size:16px;font-weight:700;fill:var(--accent-ink);font-variant-numeric:tabular-nums}
.t-gate{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.13em;fill:var(--ink-soft)}
.t-loop{font-size:12.5px;fill:var(--pizarra)}
.t-brk{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.16em;fill:var(--ink-mute)}
.t-sub{font-size:10.5px;fill:var(--ink-mute)}
.pill-gate{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.pill-hot{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1}
.dot-on{fill:var(--bosque)}
.dot-wip-ring{fill:none;stroke:var(--accent);stroke-width:1.6}
.dot-wip-core{fill:var(--accent)}

figcaption{
  font-size:13.5px;line-height:1.6;color:var(--ink-mute);
  margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft);max-width:92ch;
}
figcaption b{color:var(--ink-soft);font-weight:600}
figcaption .mono{font-family:var(--mono);font-size:.9em}

@media print{
  @page{ size: 420mm 248mm; margin: 0; }
  /* el PDF sale siempre en la version clara, sin importar el tema del equipo */
  :root, :root[data-theme="dark"]{
    --ground:#e7e1d5;--surface:#f3efe6;--surface-2:#eae3d5;
    --ink:#1e1a18;--ink-soft:#453f37;--ink-mute:#6f675c;
    --line:#cbc2b0;--line-soft:#dcd4c4;
    --bosque:#2f3f32;--accent:#c08428;--accent-ink:#8a5f14;--accent-wash:#f0e2c6;--pizarra:#385161;
  }
  html,body{background:var(--ground) !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:15mm 16mm 13mm}
  .board{overflow:visible;padding-bottom:0}
  .board svg{min-width:0;width:100%}
  .head{margin-bottom:20px}
  figcaption{max-width:none;break-inside:avoid}
  figure{break-inside:avoid}
}

@media (max-width:640px){
  main{padding:26px 16px 34px}
  .head h1{font-size:22px}
}
