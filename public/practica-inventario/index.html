<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Práctica · Compras e inventario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="practica.css">
</head>
<body>
<div class="wrap">
  <header class="cabecera">
    <div class="cab-fila">
      <div>
        <span class="rot">Administrativa y financiera · Compras e inventario</span>
        <h1>Módulo de práctica</h1>
      </div>
      <span class="aviso-local">Práctica: datos inventados · nada llega a la intranet</span>
    </div>
    <div class="cab-fila">
      <div class="pestanas" role="tablist" id="pestanas"></div>
      <div class="cab-der">
        <label class="perfil"><span>Practicas como</span><select id="perfil" aria-label="Practicas como"></select></label>
        <button class="btn-vidrio" id="reiniciar">Empezar de nuevo</button>
      </div>
    </div>
  </header>
  <main id="contenido"></main>
</div>
<dialog id="dlg"></dialog>
<div id="aviso" class="aviso-flot" role="status" hidden></div>
<script src="datos.js"></script>
<script src="practica.js"></script>
</body>
</html>
